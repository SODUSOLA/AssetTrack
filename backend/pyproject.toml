[tool.poetry]
name = "lasrra-audit"
version = "0.1.0"
description = "LASRRA Engineering Audit System"
authors = ["LASRRA Engineering"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = ">=0.115,<1"
uvicorn = { version = ">=0.32,<1", extras = ["standard"] }
sqlalchemy = ">=2.0,<2.1"
alembic = ">=1.14,<2"
psycopg = { version = ">=3.2,<4", extras = ["binary"] }
pydantic-settings = ">=2.6,<3"
pyjwt = ">=2.9,<3"
argon2-cffi = ">=23.1,<26"
slowapi = ">=0.1.9,<1"
email-validator = ">=2.2,<3"
tzdata = ">=2024.1"
openpyxl = ">=3.1,<4"
reportlab = ">=4.2,<5"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9"
pytest-cov = ">=6,<7"
httpx = ">=0.28,<1"
ruff = ">=0.8,<1"
pypdf = ">=5,<7"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
