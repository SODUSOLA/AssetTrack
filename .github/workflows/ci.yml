name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: audit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit -d audit_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://audit:audit@localhost:5432/audit_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.5
      - run: poetry install --no-root
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run pytest --cov=app
      - name: The committed OpenAPI document is current
        run: |
          poetry run python -m scripts.dump_openapi > /tmp/openapi.json
          diff -u ../frontend/openapi.json /tmp/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: The generated API types are current
        run: |
          npm run api:types
          git diff --exit-code src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run budget

  e2e:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit
          POSTGRES_DB: audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit -d audit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install poetry==1.8.5
      - run: poetry install --no-root --only main
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the web app
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser tests against the real API
        env:
          PYTHON: poetry run python
          CI: "true"
        run: scripts/e2e.sh   # from the repository root; it runs the API inside backend/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
